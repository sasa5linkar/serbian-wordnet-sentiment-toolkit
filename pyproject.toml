[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serbian-sentiment-wsd-toolkit"
version = "0.1.1"
description = "Explainable Serbian WordNet sentiment analysis with word-sense disambiguation."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DOCS", "NOTICE"]
authors = [{name = "Saša Z. Petalinkar"}]
dependencies = []

[project.optional-dependencies]
wsd = ["torch>=2.0", "transformers>=4.49,<4.50", "safetensors>=0.4"]
full = [
    "click>=8.1,<9",
    "openpyxl>=3.1,<4",
    "spacy>=3.7.2,<3.8",
    "spacy-transformers>=1.3,<1.4",
    "torch>=2.0",
    "transformers>=4.49,<4.50",
    "safetensors>=0.4",
]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "build>=1.2", "openpyxl>=3.1,<4", "tomli>=2; python_version < '3.11'"]

[project.scripts]
sr-sentiment = "serbian_sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_wsd: requires local production model and lexical resources"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["serbian_sentiment"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "spacy", "spacy.*"]
ignore_missing_imports = true
follow_imports = "skip"
